name: Debug image
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Start container and probe
        run: |
          docker run -d --name rl --security-opt seccomp=unconfined --shm-size=1g ghcr.io/grantm28/runelite-web:latest
          sleep 75
          docker logs rl 2>&1 | grep -i "watchdog\|error" | tail -20
          docker exec rl bash -c 'ps aux | grep -i "bolt\|runelite\|java" | grep -v grep; echo "== bolt.log =="; tail -40 /config/logs/bolt.log'
          echo "== windows =="
          docker exec -u abc -e DISPLAY=:1 rl bash -c 'xwininfo -root -tree | grep -v "has no name" | head -30; import -window root /tmp/shot.png'
          docker cp rl:/tmp/shot.png shot.png
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: shot.png
