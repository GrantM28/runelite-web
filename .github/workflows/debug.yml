name: Debug image
on: workflow_dispatch
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Start container
        run: |
          docker run -d --name rl --security-opt seccomp=unconfined --shm-size=1g -p 3001:3001 ghcr.io/grantm28/runelite-web:latest
          sleep 40
      - name: Load web UI in headless Chromium
        run: |
          npm i -g playwright@1.49.1 >/dev/null 2>&1 && npx -y playwright@1.49.1 install --with-deps chromium >/dev/null 2>&1
          cat > shot.js <<'JS'
          const { chromium } = require(process.env.PW);
          (async () => {
            const b = await chromium.launch();
            const p = await b.newPage({ ignoreHTTPSErrors: true, viewport: { width: 1280, height: 800 } });
            p.on('console', m => console.log('console:', m.type(), m.text().slice(0, 200)));
            p.on('websocket', ws => { console.log('ws open', ws.url()); ws.on('close', () => console.log('ws closed', ws.url())); });
            await p.goto('https://localhost:3001/', { waitUntil: 'load' });
            for (const t of [5, 15, 30]) { await p.waitForTimeout(t === 5 ? 5000 : 10000 + (t === 30 ? 5000 : 0)); await p.screenshot({ path: `ui-${t}s.png` }); console.log('shot', t); }
            await b.close();
          })();
          JS
          PW=$(npm root -g)/playwright node shot.js 2>&1 | grep -v "^console: debug" | head -80
          echo "== container =="; docker exec rl bash -c 'pgrep -fc "bolt-launcher/bolt"; tail -5 /config/logs/bolt.log'; docker logs rl 2>&1 | tail -25
      - uses: actions/upload-artifact@v4
        with:
          name: ui
          path: ui-*.png
