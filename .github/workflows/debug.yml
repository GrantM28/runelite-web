name: Debug image
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Start container and probe
        run: |
          docker run -d --name rl --security-opt seccomp=unconfined --shm-size=1g ghcr.io/grantm28/runelite-web:latest
          sleep 50
          docker exec -u abc rl bash -c 'p=$(pgrep -x openbox); tr "\0" "\n" < /proc/$p/environ > /tmp/env.txt'
          for drop in "^LD_PRELOAD=" "^NOTHING"; do
            echo "==== raw bolt, env without $drop ===="
            docker exec -u abc rl bash -c 'mapfile -t E < <(grep -v "'"$drop"'" /tmp/env.txt); env -i "${E[@]}" timeout 12 /opt/bolt/bolt-launcher/bolt >/dev/null 2>&1; echo "exit=$?"'
          done
          echo "==== real autostart (new image) ===="
          docker exec rl bash -c 'ps aux | grep -c "[b]olt-launcher/bolt"; tail -6 /config/logs/bolt.log'
          docker exec -u abc -e DISPLAY=:1 rl bash -c 'xwininfo -root -tree | grep -i bolt; import -window root /tmp/shot.png'
          docker cp rl:/tmp/shot.png shot.png
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: shot.png
