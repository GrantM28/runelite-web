name: Debug image
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Start container and probe
        run: |
          docker run -d --name rl --security-opt seccomp=unconfined --shm-size=1g -e RESTART_APP=false ghcr.io/grantm28/runelite-web:latest
          sleep 40
          docker exec -u abc rl bash -c 'p=$(pgrep -x openbox); echo "== openbox env =="; tr "\0" "\n" < /proc/$p/environ | sort > /tmp/env.txt; cat /tmp/env.txt'
          for v in NONE LD_PRELOAD SDL_JOYSTICK_DEVICE ALL; do
            echo "==== test unset=$v ===="
            docker exec -u abc rl bash -c '
              mapfile -t E < /tmp/env.txt
              case '"$v"' in
                NONE) env -i "${E[@]}" timeout 15 /opt/bolt/bolt-launcher/bolt 2>&1 | grep -v dbus/ | tail -15 ;;
                ALL) env -i HOME=/config DISPLAY=:1 PATH=/usr/bin:/bin timeout 15 /opt/bolt/bolt-launcher/bolt 2>&1 | grep -v dbus/ | tail -5 ;;
                *) env -i "${E[@]}" -u '"$v"' timeout 15 /opt/bolt/bolt-launcher/bolt 2>&1 | grep -v dbus/ | tail -5 ;;
              esac
              echo "exit=${PIPESTATUS[0]}"'
          done
