name: Build and publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly rebuild to pick up base image and RuneLite launcher updates
    - cron: "0 6 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-test:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: First start, then recreate with the same /config (new hostname)
        run: |
          IMG=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::7}
          mkdir -p cfg
          docker run -d --name rl1 -v $PWD/cfg:/config --security-opt seccomp=unconfined --shm-size=1g $IMG
          sleep 60
          docker rm -f rl1
          docker run -d --name rl -v $PWD/cfg:/config --security-opt seccomp=unconfined --shm-size=1g $IMG
          sleep 60

      - name: Check Bolt window and capture screenshot
        run: |
          docker exec rl tail -20 /config/logs/bolt.log
          docker exec -u abc -e DISPLAY=:1 rl bash -c 'xwininfo -root -tree | grep -i "bolt"; import -window root /tmp/shot.png'
          docker cp rl:/tmp/shot.png shot.png
          docker exec -u abc -e DISPLAY=:1 rl xwininfo -root -tree | grep -q '"Bolt Launcher"'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-screenshot
          path: shot.png
