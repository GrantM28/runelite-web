name: Build, test and publish

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore: ["**.md", "docs/**", "assets/**", ".github/ISSUE_TEMPLATE/**"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly rebuild to pick up base image, Java and RuneLite launcher updates
    - cron: "0 6 * * 1"

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      test_tag: ${{ steps.vars.outputs.test_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Variables
        id: vars
        run: |
          echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"
          echo "test_tag=${IMAGE,,}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="dev-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the immutable sha tag is pushed here; `latest` and version tags are
      # added after the smoke test passes.
      - name: Build and push test image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.vars.outputs.test_tag }}
          build-args: VERSION=${{ steps.vars.outputs.version }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-test:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: First start, then recreate with the same /config (new hostname)
        run: |
          IMG=${{ needs.build.outputs.test_tag }}
          mkdir -p cfg
          docker run -d --name rl1 -v $PWD/cfg:/config --security-opt seccomp=unconfined --shm-size=1g $IMG
          sleep 60
          docker rm -f rl1
          docker run -d --name rl -v $PWD/cfg:/config --security-opt seccomp=unconfined --shm-size=1g \
            -e PASSWORD=smoke-test-only $IMG
          sleep 60

      - name: Checks
        run: |
          echo "== container log =="; docker logs rl 2>&1 | head -40
          echo "== bolt.log =="; docker exec rl tail -20 /config/logs/bolt.log
          docker exec -u abc -e DISPLAY=:1 rl bash -c 'xwininfo -root -tree | grep -i bolt; import -window root /tmp/shot.png'
          docker cp rl:/tmp/shot.png shot.png
          # Bolt window is up
          docker exec -u abc -e DISPLAY=:1 rl xwininfo -root -tree | grep -q '"Bolt Launcher"'
          # Version banner printed by our init service
          docker logs rl 2>&1 | grep -q "Bolt launcher"
          # Web server answers and enforces the password
          code=$(docker exec rl curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:3001/)
          echo "https status without credentials: $code"; test "$code" = 401
          # Docker healthcheck turns healthy
          for i in $(seq 1 20); do s=$(docker inspect -f '{{.State.Health.Status}}' rl); [ "$s" = healthy ] && break; sleep 5; done
          echo "health: $s"; test "$s" = healthy

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-screenshot
          path: shot.png

  publish:
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag tested image
        run: |
          SRC=${{ needs.build.outputs.test_tag }}
          IMG=${IMAGE,,}
          tags=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
            tags+=(-t "$IMG:$v" -t "$IMG:${v%.*}" -t "$IMG:${v%%.*}" -t "$IMG:latest")
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tags+=(-t "$IMG:latest")
          fi
          [ ${#tags[@]} -gt 0 ] && docker buildx imagetools create "${tags[@]}" "$SRC"
          echo "Published: ${tags[*]}"

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Pull: `docker pull ghcr.io/grantm28/runelite-web:latest`
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
